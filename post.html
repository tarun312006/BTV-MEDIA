<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTV News Post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mandali&family=Noto+Sans+Telugu:wght@400;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/post.css" />
  </head>
  <body class="post-body">
    <!-- ==========================================
         TOP HEADER & BACK NAVIGATION
         // Back navigation code: returns user to previous page/dashboard.
         ========================================== -->
    <header class="post-header">
      <button type="button" class="back-nav-btn" id="backNavBtn" aria-label="Go back">
        <span class="back-arrow">←</span>
        <span>Back</span>
      </button>

      <a href="dashboard.html" class="post-brand-wrap" aria-label="BTV Media">
        <img src="assets/btv-logo.png" alt="BTV Media logo" class="post-brand-logo" />
        <span class="post-brand-text">BTV MEDIA</span>
      </a>
    </header>

    <main class="post-page">
      <div id="publicCard" class="public-card" aria-live="polite"></div>
    </main>

    <script src="js/post.js"></script>
  </body>
</html>
