<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTV News System | My Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mandali&family=Noto+Sans+Telugu:wght@400;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/my-cards.css" />
  </head>
  <body class="my-cards-page-body">
    <header class="dashboard-header">
      <a href="dashboard.html" class="brand-wrap" aria-label="Go to dashboard">
        <img src="assets/btv-logo.png" alt="BTV Media logo" class="brand-logo" />
        <div class="brand-copy">
          <span class="brand-main">BTV MEDIA</span>
          <span class="brand-sub">NEWS SYSTEM</span>
        </div>
      </a>

      <nav class="header-nav" aria-label="Dashboard navigation">
        <a href="dashboard.html" class="nav-link" data-action="new-card">+ New Card</a>

        <!-- ==========================================
             PROFILE BUTTON & DROPDOWN MENU
             Controls access to Reporter Details, My Cards, and Logout.
             ========================================== -->
        <div class="profile-menu-wrap" id="profileMenuWrap">
          <button type="button" class="profile-btn" id="profileBtn" aria-expanded="false" aria-label="Reporter Profile">
            <span class="profile-avatar-thumb" id="headerProfileAvatar">R</span>
            <span class="profile-btn-label" id="headerProfileName">Profile</span>
            <svg class="profile-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <!-- Profile Dropdown Content -->
          <div class="profile-dropdown" id="profileDropdown" aria-hidden="true">
            <div class="profile-card-header">
              <div class="profile-photo-wrap" id="profileCardPhotoWrap">
                <img id="profileCardPhoto" class="profile-photo hidden" src="" alt="Reporter Photo" />
                <div id="profileCardAvatarFallback" class="profile-avatar-fallback">R</div>
              </div>
              <div class="profile-details">
                <div class="profile-name" id="profileReporterName">Reporter</div>
                <div class="profile-meta-row">
                  <div class="profile-id-badge">
                    <span class="id-label">ID:</span>
                    <span class="id-value" id="profileReporterId">—</span>
                  </div>
                  <div class="profile-dob-badge" id="profileDobWrap">
                    <span class="dob-label">DOB:</span>
                    <span class="dob-value" id="profileReporterDob">—</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="profile-divider"></div>

            <div class="profile-menu-links">
              <!-- My Cards Option -->
              <a href="my-cards.html" class="profile-menu-item active" id="profileMyCardsBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="3" y1="9" x2="21" y2="9"></line>
                  <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
                <span>My Cards</span>
              </a>

              <!-- Logout Option -->
              <button type="button" class="profile-menu-item danger" id="profileLogoutBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Logout</span>
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="my-cards-page">
      <!-- ==========================================
           BACK NAVIGATION
           // Back navigation code: returns user to previous page/dashboard.
           ========================================== -->
      <div class="page-topbar">
        <div class="topbar-left">
          <button type="button" class="back-nav-btn" id="backNavBtn" aria-label="Go back">
            <span class="back-arrow">←</span>
            <span>Back</span>
          </button>
          <div class="title-wrap">
            <h1>📰 Published Cards</h1>
            <p id="cardsCount" class="cards-count">0 cards</p>
          </div>
        </div>

        <a href="dashboard.html" class="primary-btn" id="newCardBtn">+ New Card</a>
      </div>

      <!-- ==========================================
           CATEGORY FILTERS / TABS
           // My Cards category filtering
           All | Breaking News | For You | News | Politics | Business | Sports | Entertainment | Crime
           ========================================== -->
      <nav class="category-filter-bar" id="categoryFilterBar" aria-label="Filter cards by category">
        <button type="button" class="category-tab active" data-category="All">All</button>
        <button type="button" class="category-tab" data-category="Breaking News">Breaking News</button>
        <button type="button" class="category-tab" data-category="For You">For You</button>
        <button type="button" class="category-tab" data-category="News">News</button>
        <button type="button" class="category-tab" data-category="Politics">Politics</button>
        <button type="button" class="category-tab" data-category="Business">Business</button>
        <button type="button" class="category-tab" data-category="Sports">Sports</button>
        <button type="button" class="category-tab" data-category="Entertainment">Entertainment</button>
        <button type="button" class="category-tab" data-category="Crime">Crime</button>
      </nav>

      <section id="cardsGrid" class="cards-grid" aria-live="polite"></section>
    </main>

    <script src="assets/btv-logo-dataurl.js"></script>
    <script src="js/my-cards.js"></script>
  </body>
</html>
